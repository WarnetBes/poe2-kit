# Live-смок против живых API PoE2 (P2 #19).
# ⚠️ ВАЖНО (проверено 2026-09-25): git.sourcecraft.dev НЕ исполняет GitHub Actions —
# у хоста нет web/actions-роутов (отдаёт {"message":"Not Found"}), поэтому ЭТОТ
# воркфлоу здесь ИНЕРТЕН. Он сохранён как ПОРТАТИВНЫЙ шаблон (на случай переезда
# репо на GitHub/GitLab/self-hosted runner).
# Реально ежесуточный прогон идёт через ЛОКАЛЬНЫЙ планировщик:
#   run_live_smoke_daily.bat        (рабочий скрипт, CRLF)
#   install_live_smoke_task.bat     (регистрирует Task Scheduler, ежедневно 06:00 local).
# Цель — регресс-защита: stat-id таблица trade2 и схемы poe2scout / poe.ninja
# меняются на патчах; если сломались — проверка падает с ненулевым кодом.

name: live-smoke (#19)

on:
  # push в main — чтобы регресс stat-id ловился мгновенно (и для валидации воркфлоу)
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core (dist)
        run: npm run build -w @poe2-kit/core

      - name: Live smoke против живых API
        run: node packages/core/live-smoke.mjs
        env:
          # Свой кэш HTTP — в CI он всегда свежий, ходим в реальные эндпоинты.
          POE2_KIT_CACHE_DIR: ${{ runner.temp }}/poe2k-live-cache