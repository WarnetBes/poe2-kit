# CI/CD poe2-kit (SourceCraft).
# ⚠️ git.sourcecraft.dev НЕ исполняет GitHub Actions (см. .github/workflows/README
# в live-smoke.yml) — этот формат, .sourcecraft/ci.yaml, исполняется нативно.
#
# Шаг 1 (разведка): пинг-воркфлоу — проверка доступности cloud worker,
# минимум ресурсов, окружение. После подтверждения сюда добавится
# workflow pob-oracle (headless-PoB2 оракул, Docker-куб с LuaJIT;
# blueprint — test.yml апстримного PathOfBuilding-PoE2: `cd src;
# LUA_PATH=../runtime/lua/?.lua; luajit HeadlessWrapper.lua`).

on:
  push:
    # pob-oracle на push дорогой (~70 МБ PoB2 zip): гоняем только при
    # изменениях oracle/. Прочие push — только быстрый ci-ping.
    - workflows: [pob-oracle]
      filter:
        branches: [main]
        paths: [oracle/**]
    - workflows: [ci-ping]
      filter:
        branches: [main]
  schedule:
    - workflows: [ci-ping]
      cron: "23 4 * * 1"
      description: "еженедельная проверка живости CI-раннера (+1 к отчёту)"
    - workflows: [pob-oracle]
      cron: "41 5 * * 1"
      description: "еженедельный headless-PoB2 оракул: ловим дрейф данных/формул PoB2"

workflows:
  ci-ping:
    tasks:
      - name: ping
        cubes:
          - name: env-check
            script:
              - uname -a
              - node --version || echo "no node"
              - luajit -v || echo "no luajit (ожидаемо вне Docker-куба)"
              - git --version
              - echo "SOURCECRAFT_WORKSPACE=$SOURCECRAFT_WORKSPACE"
              - ls

  # Headless-PoB2 оракул — эталон чисел для poe2_build_estimate:
  # настоящий движок PoB2 без GUI (HeadlessWrapper), 5 сценариев,
  # сравнение с golden (tolerance 1e-4). Дрейф данных PoB2 / формул кита
  # красит джобу — golden обновляется только осознанно (oracle/README.md).
  # Образ — тот же, что в CI самого PoB2 (luajit+окружение гарантированы
  # апстримом); curl/unzip/nodejs доснаряжаем apk-ом на месте.
  pob-oracle:
    tasks:
      - name: oracle-run
        cubes:
          - name: run-oracle
            image: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
            script:
              - cd "$SOURCECRAFT_WORKSPACE"
              - apk add --no-cache curl unzip nodejs
              # стейджинг zip'ом: git-клон тяжёлых репо нестабилен (early EOF)
              - curl -fsSL -o pob2.zip https://codeload.github.com/PathOfBuildingCommunity/PathOfBuilding-PoE2/zip/refs/tags/v0.23.1
              - unzip -q pob2.zip
              - mv PathOfBuilding-PoE2-0.23.1 pob2
              # снимок оракула + сверка с golden (exit 1 при расхождении)
              - sh oracle/run-oracle.sh pob2/src
            artifacts:
              paths:
                - oracle/oracle-output.jsonl
